<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品集 | Portfolio</title>
    <style>
        :root {
            --bg-color: #fdfdfd;
            --text-primary: #333333;
            --text-secondary: #777777;
            --border-color: #eaeaea;
            --font-main: 'Noto Sans TC', sans-serif;
            --font-serif: 'Noto Serif TC', serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            padding-top: 80px; /* 為 fixed header 留白 */
        }

        a { text-decoration: none; color: inherit; }

        /* 導覽列 (共用) */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(253, 253, 253, 0.95);
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
        }
        .logo { font-family: var(--font-serif); font-size: 1.2rem; letter-spacing: 0.1em; }
        nav ul { list-style: none; display: flex; gap: 2rem; }
        nav a { font-size: 0.9rem; letter-spacing: 0.05em; position: relative; }
        nav a::after {
            content: ''; position: absolute; width: 0; height: 1px;
            bottom: -4px; left: 0; background-color: var(--text-primary); transition: width 0.3s ease;
        }
        nav a:hover::after, nav a.active::after { width: 100%; }

        /* 頁面標題 */
        .page-header {
            text-align: center;
            padding: 6rem 5% 4rem;
        }
        .page-header h1 {
            font-family: var(--font-serif);
            font-size: 2.5rem;
            font-weight: 300;
            margin-bottom: 1rem;
            letter-spacing: 0.05em;
        }
        .page-header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            letter-spacing: 0.1em;
        }

        /* 作品集網格 */
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 4rem 2rem;
            padding: 0 5% 6rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* 單個專案項目 */
        .project-card {
            display: block;
            group; /* 用於 hover 效果 */
        }

        .project-image-wrapper {
            position: relative;
            overflow: hidden;
            aspect-ratio: 4/3;
            margin-bottom: 1.5rem;
            background-color: #f0f0f0; /* 圖片載入前的背景 */
        }

        .project-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .project-card:hover .project-image-wrapper img {
            transform: scale(1.05); /* 輕微放大效果 */
        }

        .project-info h2 {
            font-family: var(--font-serif);
            font-size: 1.2rem;
            font-weight: 400;
            margin-bottom: 0.5rem;
            transition: color 0.3s;
        }

        .project-info p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            letter-spacing: 0.05em;
        }
        
        .project-card:hover .project-info h2 {
            color: #777; /* hover 時文字變淡 */
        }

        /* 響應式調整 */
        @media (max-width: 768px) {
            .portfolio-grid {
                grid-template-columns: 1fr; /* 手機版單欄 */
                gap: 3rem;
            }
            header { padding: 1.5rem 5%; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400&family=Noto+Serif+TC:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo"><a href="index.html">Y. DESIGN</a></div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="portfolio.html" class="active">Portfolio</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="page-header">
            <h1>Selected Works</h1>
            <p>2024 - 2026</p>
        </section>

        <section class="portfolio-grid">
            
            <!-- 專案 1 -->
            <a href="#" class="project-card">
                <div class="project-image-wrapper">
                    <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&q=80&w=800" alt="專案圖片 2">
                </div>
                <div class="project-info">
                    <h2>簡約生活 App 介面</h2>
                    <p>UI/UX Design / App</p>
                </div>
            </a>

            <!-- 專案 2 -->
            <a href="#" class="project-card">
                <div class="project-image-wrapper">
                    <img src="https://images.unsplash.com/photo-1586023492125-27b2c045efd7?auto=format&fit=crop&q=80&w=800" alt="專案圖片 3">
                </div>
                <div class="project-info">
                    <h2>空間攝影集排版</h2>
                    <p>Editorial / Photography</p>
                </div>
            </a>

            <!-- 專案 3 -->
            <a href="#" class="project-card">
                <div class="project-image-wrapper">
                    <img src="https://images.unsplash.com/photo-1600132806370-bf17e65e942f?auto=format&fit=crop&q=80&w=800" alt="專案圖片 4">
                </div>
                <div class="project-info">
                    <h2>Aesop 概念店網頁企劃</h2>
                    <p>Web Design / Development</p>
                </div>
            </a>
        </section>
    </main>
</body>
</html>
